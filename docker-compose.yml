services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CTC_StrongPassword_123!"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CTC_StrongPassword_123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: CTC_API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db;Database=CTC_Database;User Id=sa;Password=CTC_StrongPassword_123!;TrustServerCertificate=True"
      Jwt__Key: "MotChiecChiaKhoaBiMatSieuDaiVaSieuBaoMatChoGiaiDauCTC2026!!!"
      Jwt__Issuer: "CTC_Tournament"
      Jwt__Audience: "CTC_Players"
    ports:
      - "5196:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mssql_data:
